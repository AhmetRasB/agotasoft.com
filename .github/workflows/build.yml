# Build check only: lint, static export, broken-link scan, PHP syntax. Deployment stays manual (cPanel zip upload).
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run check:links

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
      - name: Lint PHP
        run: find admin api -name '*.php' -not -path 'admin/vendor/*' -print0 | xargs -0 -n1 php -l
